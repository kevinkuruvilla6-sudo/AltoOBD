name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build AltoOBDDashboard.ipa
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project with XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project AltoOBDDashboard.xcodeproj \
            -scheme AltoOBDDashboard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            SWIFT_STRICT_CONCURRENCY=minimal \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AltoOBDDashboard.app Payload/
          zip -r -y AltoOBDDashboard.ipa Payload
          ls -lh AltoOBDDashboard.ipa

      - name: Upload AltoOBDDashboard.ipa
        uses: actions/upload-artifact@v4
        with:
          name: AltoOBDDashboard-iOS-IPA
          path: AltoOBDDashboard.ipa
          retention-days: 30
